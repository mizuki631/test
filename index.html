
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090817">
<title>NOISE. — MY MUSIC ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Noto+Serif+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #090817;
  --panel: #141128;
  --panel2: #1b1734;
  --purple: #a987ff;
  --blue: #65d7ff;
  --white: #f7f4ff;
  --muted: #aaa4c4;
  --line: #ffffff20;
  --mono: "DM Mono", monospace;
  --display: "Anton", sans-serif;
  --jp: "Zen Kaku Gothic New", sans-serif;
  --serif: "Noto Serif JP", serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 88px;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--jp);
  overflow-x: hidden;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  opacity: .07;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
}

img {
  display: block;
  width: 100%;
  object-fit: cover;
}

::selection {
  background: var(--purple);
  color: #090817;
}

.wrap {
  width: min(1160px, 90%);
  margin: auto;
}

/* ヘッダー */

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 17px 5%;
  background: #090817d9;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
}

.logo {
  font: 30px var(--display);
  letter-spacing: 2px;
  color: var(--purple);
}

.nav {
  display: flex;
  gap: 30px;
}

.nav a {
  font: 11px var(--mono);
  letter-spacing: 1.5px;
  color: #d9d2f4;
  transition: .25s;
}

.nav a:hover {
  color: var(--blue);
}

.menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--line);
  padding: 8px 12px;
}

/* メインビジュアル */

.hero {
  min-height: 94vh;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(90deg, #090817f2 0%, #090817a8 58%, #09081745),
    linear-gradient(0deg, var(--bg), transparent 45%),
    url("https://images.unsplash.com/photo-1506157786151-b8491531f063?w=2000") center/cover;
}

.hero:before {
  content: "MUSIC";
  position: absolute;
  left: -3%;
  top: 16%;
  font: clamp(150px, 29vw, 390px)/.8 var(--display);
  color: #a987ff12;
  white-space: nowrap;
  transform: rotate(-7deg);
}

.hero-inner {
  position: relative;
  z-index: 1;
  width: min(1160px, 90%);
  margin: 90px auto 40px;
}

.eyebrow,
.kicker {
  font: 11px var(--mono);
  letter-spacing: 3px;
  color: var(--blue);
}

.hero h1 {
  font: clamp(90px, 17vw, 220px)/.78 var(--display);
  letter-spacing: -4px;
  margin: 30px 0;
}

.hero h1 span {
  display: block;
  margin-left: 10%;
  color: transparent;
  -webkit-text-stroke: 2px #d1c2ff;
}

.hero-copy {
  font: 700 clamp(19px, 3vw, 29px) var(--serif);
  letter-spacing: 4px;
  margin: 38px 0 12px;
}

.hero-copy em {
  font-style: normal;
  color: var(--blue);
}

.hero-sub {
  color: #c1bad8;
  font-size: 13px;
  line-height: 2;
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 32px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px 22px;
  border: 1px solid var(--purple);
  background: var(--purple);
  color: #100b22;
  font: 12px var(--mono);
  letter-spacing: 1px;
  transition: .25s;
  cursor: pointer;
}

.btn:hover {
  background: transparent;
  color: var(--white);
  transform: translateY(-3px);
}

.btn.ghost {
  background: transparent;
  color: var(--white);
  border-color: #ffffff55;
}

.btn.ghost:hover {
  border-color: var(--blue);
  color: var(--blue);
}

.hero-stamp {
  position: absolute;
  right: 7%;
  bottom: 12%;
  width: 122px;
  height: 122px;
  border: 1px solid #c4aaff;
  border-radius: 50%;
  display: grid;
  place-content: center;
  text-align: center;
  font: 9px/1.8 var(--mono);
  letter-spacing: 1px;
  color: #d9caff;
  transform: rotate(10deg);
}

.hero-stamp strong {
  font: 34px var(--serif);
  display: block;
}

.scroll-note {
  position: absolute;
  bottom: 25px;
  left: 5%;
  font: 10px var(--mono);
  letter-spacing: 2px;
  color: var(--muted);
  writing-mode: vertical-rl;
}

/* 流れるテキスト */

.ticker {
  overflow: hidden;
  border-block: 1px solid #8065c8;
  background: #17112e;
  padding: 13px 0;
}

.ticker-track {
  display: flex;
  width: max-content;
  animation: marquee 28s linear infinite;
}

.ticker span {
  font: 26px var(--display);
  letter-spacing: 3px;
  color: #c9baff;
  margin-right: 32px;
  white-space: nowrap;
}

.ticker span:nth-child(even) {
  color: var(--blue);
}

@keyframes marquee {
  to {
    transform: translateX(-50%);
  }
}

/* セクション共通 */

section {
  padding: 112px 0;
  position: relative;
}

.section-head {
  margin-bottom: 38px;
}

.section-top {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
}

.num {
  font: 22px var(--display);
  color: var(--blue);
}

.section-title {
  font: clamp(58px, 10vw, 112px)/.9 var(--display);
  letter-spacing: -1px;
}

.section-title span {
  color: var(--purple);
}

.jp-title {
  font: 700 17px var(--serif);
  letter-spacing: 2px;
  margin-top: 22px;
}

.desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 2;
  margin-top: 9px;
}

.section-intro {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 30px;
}

.counter {
  font: 11px var(--mono);
  color: var(--muted);
  white-space: nowrap;
}

/* 検索・ジャンルフィルター */

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 28px 0 24px;
}

.search {
  flex: 1;
  min-width: 210px;
  max-width: 340px;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 12px 15px;
  color: var(--white);
  outline: none;
}

.search:focus {
  border-color: var(--blue);
}

.filters {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.filter {
  border: 1px solid #ffffff35;
  background: transparent;
  padding: 10px 13px;
  color: var(--muted);
  font: 10px var(--mono);
  cursor: pointer;
  transition: .2s;
}

.filter:hover,
.filter.active {
  border-color: var(--purple);
  background: #a987ff20;
  color: var(--white);
}

/* お気に入りカード */

.music-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 17px;
}

.music-card {
  position: relative;
  min-height: 350px;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid #a987ff38;
  isolation: isolate;
  transition: transform .35s, border-color .35s;
}

.music-card:hover {
  transform: translateY(-7px);
  border-color: var(--blue);
}

.music-card img {
  position: absolute;
  inset: 0;
  height: 100%;
  z-index: -2;
  transition: transform .7s, filter .5s;
  filter: saturate(.75);
}

.music-card:hover img {
  transform: scale(1.07);
  filter: saturate(1.2);
}

.music-card:after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, #09081705 20%, #090817ed 100%);
}

.card-top {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tag {
  font: 9px var(--mono);
  letter-spacing: 1.5px;
  color: var(--blue);
  background: #090817b8;
  padding: 7px 9px;
}

.fav {
  width: 34px;
  height: 34px;
  border: 1px solid #ffffff66;
  background: #090817a8;
  border-radius: 50%;
  cursor: pointer;
  font-size: 17px;
  transition: .2s;
}

.fav:hover,
.fav.on {
  color: #ff8fc1;
  border-color: #ff8fc1;
}

.music-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 23px;
}

.music-info h3 {
  font: 700 20px/1.5 var(--serif);
  margin: 10px 0 5px;
}

.music-info p {
  font-size: 11px;
  color: #c9c2e0;
}

.card-index {
  font: 10px var(--mono);
  color: var(--blue);
  letter-spacing: 2px;
}

.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 50px 20px;
  border: 1px dashed #ffffff35;
  color: var(--muted);
}

/* 写真ギャラリー */

.photo-strip {
  display: grid;
  grid-template-columns: 1.4fr .8fr 1fr;
  gap: 13px;
  margin-top: 50px;
  align-items: center;
}

.photo-strip img {
  height: 205px;
  border: 1px solid #8065c8;
  transition: .3s;
}

.photo-strip img:nth-child(2) {
  height: 155px;
  transform: rotate(3deg);
}

.photo-strip img:nth-child(3) {
  height: 235px;
  transform: rotate(-2deg);
}

.photo-strip img:hover {
  transform: rotate(0) scale(1.025);
  filter: brightness(1.15);
}
  /* 演奏した曲 */

.played {
  background: linear-gradient(
    180deg,
    transparent,
    #14102a 45%,
    transparent
  );
}

.played-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.played-card {
  display: flex;
  min-height: 132px;
  background: #151329;
  border: 1px solid #51457d;
  overflow: hidden;
  transition: .25s;
}

.played-card:hover {
  border-color: var(--blue);
  transform: translateY(-4px);
}

.played-card img {
  width: 34%;
  max-width: 170px;
  min-height: 132px;
}

.played-info {
  padding: 17px 20px;
  align-self: center;
}

.played-number {
  font: 30px/.9 var(--display);
  color: var(--purple);
}

.played-info h3 {
  font: 700 16px/1.5 var(--serif);
  margin: 8px 0 4px;
}

.played-info p {
  font-size: 10px;
  color: var(--muted);
}

.note {
  margin-top: 20px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

/* メッセージ */

.statement {
  text-align: center;
  padding: 75px 0 100px;
}

.statement h2 {
  font: clamp(76px, 15vw, 175px)/.82 var(--display);
  color: transparent;
  -webkit-text-stroke: 1px #a987ff;
}

.statement p {
  font: 700 18px var(--serif);
  letter-spacing: 4px;
  margin-top: 30px;
}

/* ABOUT */

.about {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}

.about-image {
  height: 430px;
  position: relative;
}

.about-image img {
  height: 100%;
  filter: saturate(.8);
}

.about-image:after {
  content: "SOUND";
  position: absolute;
  right: -18px;
  bottom: 12px;
  font: 65px var(--display);
  color: var(--blue);
  text-shadow: 0 0 25px #090817;
}

.about-text h2 {
  font: 900 clamp(29px, 4vw, 43px)/1.5 var(--serif);
  margin: 24px 0;
}

.about-text h2 span {
  color: var(--purple);
}

.about-text p {
  font-size: 13px;
  color: var(--muted);
  line-height: 2.5;
}

.about-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 22px;
}

.about-tags span {
  font: 10px var(--mono);
  border: 1px solid #ffffff30;
  padding: 8px 10px;
  color: #d2c9ef;
}

/* フッター */

footer {
  padding: 80px 5% 30px;
  text-align: center;
  border-top: 1px solid #7257b6;
}

.footer-big {
  font: clamp(55px, 12vw, 135px)/1 var(--display);
  color: var(--purple);
}

footer p {
  font: 10px var(--mono);
  color: var(--muted);
  letter-spacing: 2px;
  margin-top: 25px;
}

/* ページトップボタン */

.backtop {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 30;
  width: 42px;
  height: 42px;
  border: 1px solid #a987ff88;
  background: #141128;
  color: var(--white);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
}

.backtop.show {
  opacity: 1;
  pointer-events: auto;
}

/* スクロールアニメーション */

.reveal {
  opacity: 0;
  transform: translateY(25px);
  transition: opacity .8s, transform .8s;
}

.reveal.show {
  opacity: 1;
  transform: none;
}

/* タブレット */

@media(max-width:850px) {
  .music-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .about {
    gap: 35px;
  }

  .hero-stamp {
    right: 5%;
    width: 100px;
    height: 100px;
  }
}

/* スマートフォン */

@media(max-width:620px) {
  .topbar {
    padding: 13px 5%;
  }

  .logo {
    font-size: 25px;
  }

  .menu-btn {
    display: block;
  }

  .nav {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    padding: 18px 5%;
    background: #090817f5;
    border-bottom: 1px solid var(--line);
    flex-direction: column;
    gap: 18px;
  }

  .nav.open {
    display: flex;
  }

  .nav a {
    font-size: 12px;
  }

  .hero {
    min-height: 88vh;
    background-position: 58% center;
  }

  .hero-inner {
    margin-top: 80px;
  }

  .hero h1 {
    font-size: clamp(82px, 22vw, 140px);
    letter-spacing: -2px;
  }

  .hero-stamp {
    width: 78px;
    height: 78px;
    font-size: 7px;
    right: 6%;
    bottom: 9%;
  }

  .hero-stamp strong {
    font-size: 23px;
  }

  .hero-copy {
    letter-spacing: 2px;
  }

  .hero-sub {
    max-width: 80%;
  }

  .scroll-note {
    display: none;
  }

  section {
    padding: 78px 0;
  }

  .section-title {
    font-size: clamp(55px, 15vw, 85px);
  }

  .section-intro {
    display: block;
  }

  .counter {
    margin-top: 18px;
  }

  .music-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .music-card {
    min-height: 320px;
  }

  .controls {
    align-items: stretch;
  }

  .search {
    max-width: none;
    width: 100%;
  }

  .filters {
    width: 100%;
  }

  .photo-strip {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .photo-strip img {
    height: 145px;
  }

  .photo-strip img:nth-child(2) {
    height: 120px;
  }

  .photo-strip img:nth-child(3) {
    grid-column: span 2;
    height: 175px;
  }

  .played-grid {
    grid-template-columns: 1fr;
  }

  .played-card {
    min-height: 115px;
  }

  .played-card img {
    min-height: 115px;
    width: 32%;
  }

  .played-info {
    padding: 13px;
  }

  .played-info h3 {
    font-size: 14px;
  }

  .statement {
    padding: 45px 0 75px;
  }

  .statement p {
    font-size: 14px;
    letter-spacing: 2px;
  }

  .about {
    grid-template-columns: 1fr;
    gap: 35px;
  }

  .about-image {
    height: 280px;
  }

  .about-text h2 {
    font-size: 31px;
  }

  footer {
    padding-top: 60px;
  }
}

/* 動きを減らす設定 */

@media(prefers-reduced-motion:reduce) {
  *,
  *:before,
  *:after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }

  .reveal {
    opacity: 1;
    transform: none;
  }
}

  </head>
<body>

<header class="topbar">
  <a class="logo" href="#top">NOISE.</a>

  <button
    class="menu-btn"
    id="menuBtn"
    aria-label="メニューを開く"
    aria-expanded="false"
  >
    MENU ☰
  </button>

  <nav class="nav" id="nav">
    <a href="#favorite">FAVORITE</a>
    <a href="#played">PLAYED</a>
    <a href="#about">ABOUT</a>
  </nav>
</header>

<!-- メインビジュアル -->

<header class="hero" id="top">
  <div class="hero-inner">
    <p class="eyebrow">
      MY PERSONAL MUSIC ARCHIVE / 2026
    </p>

    <h1>MY<br><span>MUSIC.</span></h1>

    <p class="hero-copy">
      音楽に、<em>夢中。</em>
    </p>

    <p class="hero-sub">
      好きな曲も、弾いた曲も。<br>
      音楽でできた「自分」を集めたアーカイブ。
    </p>

    <div class="hero-actions">
      <a class="btn" href="#favorite">
        お気に入りを見る <span>↘</span>
      </a>

      <a class="btn ghost" href="#played">
        演奏した曲を見る
      </a>
    </div>
  </div>

  <div class="hero-stamp">
    EST. MY WORLD
    <strong>音楽</strong>
    PLAY IT LOUD
  </div>

  <div class="scroll-note">
    SCROLL TO EXPLORE ↓
  </div>
</header>

<!-- 流れる文字 -->

<div class="ticker">
  <div class="ticker-track">
    <span>LISTEN TO MUSIC ✳ FEEL THE SOUND ✳ PLAY IT LOUD ✳</span>
    <span>MY SOUNDTRACK ✳ FIND YOUR RHYTHM ✳</span>
    <span>LISTEN TO MUSIC ✳ FEEL THE SOUND ✳ PLAY IT LOUD ✳</span>
    <span>MY SOUNDTRACK ✳ FIND YOUR RHYTHM ✳</span>
  </div>
</div>

<main class="wrap">

<!-- お気に入りの曲 -->

<section id="favorite" class="reveal">

  <div class="section-intro">
    <div class="section-head">

      <div class="section-top">
        <span class="num">01</span>
        <span class="kicker">MY DAILY PLAYLIST</span>
      </div>

      <h2 class="section-title">
        FAVOURITE<br>
        <span>TRACKS.</span>
      </h2>

      <p class="jp-title">
        何度でも聴きたくなる音楽。
      </p>

      <p class="desc">
        最近よく聴いている、お気に入りの曲たち。<br>
        気分にぴったりの一曲を探してみよう。
      </p>
    </div>

    <p class="counter">
      <span id="trackCount">06</span> TRACKS /
      <span id="favCount">0</span> SAVED
    </p>
  </div>

  <!-- 検索・ジャンル選択 -->

  <div class="controls">

    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="曲名・アーティストで検索…"
      aria-label="曲名・アーティストで検索"
    >

    <div class="filters" aria-label="ジャンルで絞り込み">
      <button class="filter active" data-filter="ALL">ALL</button>
      <button class="filter" data-filter="ROCK">ROCK</button>
      <button class="filter" data-filter="ALT">ALTERNATIVE</button>
      <button class="filter" data-filter="J-POP">J-POP</button>
      <button class="filter" data-filter="ANIME">ANIME</button>
    </div>
  </div>

  <!-- 曲カード -->

  <div class="music-grid" id="musicGrid">

<!-- JavaScript -->

<script>
const cards = [...document.querySelectorAll('.music-card')];
const filters = [...document.querySelectorAll('.filter')];
const search = document.getElementById('searchInput');
const empty = document.getElementById('emptyMessage');

let activeFilter = 'ALL';

/* 検索とジャンル絞り込み */

function updateCards() {
  const q = search.value.trim().toLowerCase();
  let visible = 0;

  cards.forEach(card => {
    const matchGenre =
      activeFilter === 'ALL' ||
      card.dataset.genre === activeFilter;

    const matchText =
      card.dataset.search.toLowerCase().includes(q);

    card.hidden = !(matchGenre && matchText);

    if (!card.hidden) {
      visible++;
    }
  });

  empty.hidden = visible !== 0;

  document.getElementById('trackCount').textContent =
    String(visible).padStart(2, '0');
}

/* ジャンルボタン */

filters.forEach(btn => {
  btn.addEventListener('click', () => {

    filters.forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    activeFilter = btn.dataset.filter;

    updateCards();
  });
});

/* 検索入力 */

search.addEventListener('input', updateCards);

/* お気に入りボタン */

document.querySelectorAll('.fav').forEach(btn => {

  btn.addEventListener('click', () => {

    const on = btn.classList.toggle('on');

    btn.textContent = on ? '♥' : '♡';

    btn.setAttribute('aria-pressed', String(on));

    btn.setAttribute(
      'aria-label',
      on ? 'お気に入りから削除' : 'お気に入りに追加'
    );

    document.getElementById('favCount').textContent =
      document.querySelectorAll('.fav.on').length;

  });

});

/* スマホ用メニュー */

const menuBtn = document.getElementById('menuBtn');
const nav = document.getElementById('nav');

menuBtn.addEventListener('click', () => {

  const open = nav.classList.toggle('open');

  menuBtn.setAttribute('aria-expanded', String(open));

});

nav.querySelectorAll('a').forEach(a => {

  a.addEventListener('click', () => {

    nav.classList.remove('open');

    menuBtn.setAttribute('aria-expanded', 'false');

  });

});

/* スクロール時の表示アニメーション */

const observer = new IntersectionObserver(
  entries => entries.forEach(entry => {

    if (entry.isIntersecting) {

      entry.target.classList.add('show');

      observer.unobserve(entry.target);

    }

  }),
  { threshold: .12 }
);

document.querySelectorAll('.reveal').forEach(el => {
  observer.observe(el);
});

/* ページトップボタン */

const backtop = document.getElementById('backtop');

window.addEventListener(
  'scroll',
  () => {
    backtop.classList.toggle('show', window.scrollY > 500);
  },
  { passive: true }
);

backtop.addEventListener('click', () => {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
});

</script>
